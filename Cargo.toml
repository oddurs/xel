[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/oddurs/xel"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every fallible engine call returns the one documented `Error` enum; repeating that in
# an `# Errors` section on each function says nothing new.
missing_errors_doc = "allow"
