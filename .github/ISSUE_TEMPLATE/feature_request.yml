name: Feature request
description: Suggest something xel should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine xel solving it.
    validations:
      required: true
  - type: textarea
    id: elsewhere
    attributes:
      label: How other tools handle it
      description: Excel, Numbers, Airtable, or anything else that does this well or badly.
