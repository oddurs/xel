name: Bug report
description: Something in xel behaves incorrectly.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest workbook or sequence of steps that shows the problem.
      placeholder: |
        1. Create a table with ...
        2. Enter the formula ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: xel version or commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
